# Postgres tuning for a single-host dev/game server.
listen_addresses = '*'
max_connections = 200
shared_buffers = 256MB
work_mem = 8MB
maintenance_work_mem = 64MB
effective_cache_size = 768MB
wal_level = replica
synchronous_commit = off        # game state tolerates losing the last few ms on crash
checkpoint_timeout = 10min
log_min_duration_statement = 500
timezone = 'UTC'
