map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # Compression, for players on slow connections. The client's text files are gzipped once at build time
  # (tools/build/precompress.mjs) and sent as they are; API responses (JSON) are compressed on the fly.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  # Resolve the api service through Docker's DNS on every request (not once at startup),
  # so recreating the api container (new IP) doesn't leave nginx pointing at a dead address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    proxy_pass $api;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
