map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# Logging in and signing up, per address: AUTH_BURST at once, then AUTH_RATE (the image's defaults: 20, then one a
# second). Far more than a player needs (a session lasts a week, and players behind one address share it), far fewer
# than guessing passwords across many usernames wants; the wait per username is the API's
# (backend/services/api/src/auth/login-backoff.ts). A development stack allows far more at once (docker-compose.yml):
# the browser tests sign up dozens of accounts from one address in a few seconds.
# This file is a template: the image fills in the ${UPPER_CASE} settings when the container starts
# (client/web/Dockerfile), and nginx's own $variables are left alone.
limit_req_zone $binary_remote_addr zone=auth:10m rate=${AUTH_RATE};

# The access log without the query string, for the push socket: its address carries the player's token (/ws?token=…).
log_format no_query '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
  listen 80;
  root /usr/share/nginx/html;

  # The address a request came from: the one that reached nginx, whatever X-Forwarded-For it sends, unless it came from
  # the proxy the operator names in TRUSTED_PROXY (Caddy's network, docs/deployment.md), whose X-Forwarded-For is then
  # believed. The API is told that one address (below), so a client can't make its own up: it's what the limit above
  # counts and what the API stores as an account's last login address.
  set_real_ip_from ${TRUSTED_PROXY};
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # Sent with every answer, the API's and the locations' with headers of their own included (add_header_inherit).
  # The policy allows only what the client uses: its own scripts, workers, fonts and images, styles written inline
  # (React's style attributes, the toasts), and the API and push socket on its own origin. No other site may frame it.
  add_header_inherit merge;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  # Compression, for players on slow connections. The client's text files are gzipped once at build time
  # (tools/build/precompress.mjs) and sent as they are; API responses (JSON) are compressed on the fly.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/css text/plain image/svg+xml;

  # Resolve the api service through Docker's DNS on every request (not once at startup),
  # so recreating the api container (new IP) doesn't leave nginx pointing at a dead address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api http://api:3000;

  location /api/ {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # logging in and signing up, limited per address (the zone above); past the limit the answer is the API's envelope
  location ~ ^/api/v1/auth/(login|register)$ {
    limit_req zone=auth burst=${AUTH_BURST} nodelay;
    limit_req_status 429;
    error_page 429 = @auth_limited;
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location @auth_limited {
    default_type application/json;
    add_header Retry-After 5 always;
    return 429 '{"ok":-99,"error":{"code":"common.requestFailed","params":{"status":429}}}';
  }

  location /docs {
    proxy_pass $api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /ws {
    access_log /var/log/nginx/access.log no_query;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
