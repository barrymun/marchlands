# CI: every check AGENTS.md asks for before a change is finished. Run it locally with act: npm run ci:local
# (AGENTS.md, Local CI). Manual trigger only, so GitHub never runs it by itself (to save its cost for now); to turn on CI on GitHub, add
#   push: { branches: [main] }
#   pull_request:
# under `on`.
#
# Both jobs run inside the node:24 image rather than on the runner itself: act then only needs that image (not a
# 1-2 GB runner image), and Postgres is reached by its service name (`postgres`) the same way under act and on GitHub.

name: CI

on:
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    container: node:24-bookworm
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # the client build ends with its size budget (client/web/.size-limit.js)
      - run: npm run build:web
      - run: npm run build:backend

  database:
    name: Service tests (Postgres)
    runs-on: ubuntu-latest
    container: node:24-bookworm
    services:
      # the stack's Postgres (docker-compose.yml)
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marchlands
          POSTGRES_PASSWORD: marchlands
          POSTGRES_DB: marchlands
        options: >-
          --health-cmd "pg_isready -U marchlands"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # the test setup makes its own database (marchlands_test) next to this one
      DATABASE_URL: postgres://marchlands:marchlands@postgres:5432/marchlands
    steps:
      - uses: actions/checkout@v7.0.1
      - run: npm ci
      - run: npm run test:db
